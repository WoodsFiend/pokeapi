server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    location = /generator-api/generateById {
        proxy_pass https://generate.daemonarium.app/generateById;
        proxy_ssl_server_name on;
        proxy_ssl_name generate.daemonarium.app;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host generate.daemonarium.app;
        proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
        proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location = /generator-api/generateByType {
        proxy_pass https://generate.daemonarium.app/generateByType;
        proxy_ssl_server_name on;
        proxy_ssl_name generate.daemonarium.app;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_ssl_verify_depth 3;
        proxy_set_header Host generate.daemonarium.app;
        proxy_set_header CF-Access-Client-Id "${CF_ACCESS_CLIENT_ID}";
        proxy_set_header CF-Access-Client-Secret "${CF_ACCESS_CLIENT_SECRET}";
        proxy_read_timeout 1800s;
        proxy_send_timeout 1800s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|webp|ico|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
        try_files $uri =404;
    }

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
}
