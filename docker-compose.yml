services:
  daemonarium:
    build:
      context: ./website
      dockerfile: Dockerfile
    expose:
      - "80"
    restart: unless-stopped

  cache:
    image: redis:8.6.4-alpine
    volumes:
      - redis_data:/data
    restart: always

  db:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-ash}
      POSTGRES_DB: ${POSTGRES_DB:-pokeapi}
    volumes:
      - pg_data:/var/lib/postgresql/
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER:-ash} -d $${POSTGRES_DB:-pokeapi}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    user: ${RUN_AS:-pokeapi}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-ash}
      POSTGRES_DB: ${POSTGRES_DB:-pokeapi}
    volumes:
      - .:/code
      - /code/.venv/ # Ignore the venv to prevent conflicts between the host and container environments
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: always

  web:
    image: nginx:1.31.2-alpine3.23
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      daemonarium:
        condition: service_healthy
    restart: always
    # command: [nginx-debug, '-g', 'daemon off;']
    volumes:
      - ./Resources/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Resources/nginx/ssl:/ssl:ro
      - graphql_cache:/tmp/cache
  graphql-engine:
    image: hasura/graphql-engine:v2.49.4
    user: 1001:1001
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-ash}:${POSTGRES_PASSWORD:-pokemon}@db:5432/${POSTGRES_DB:-pokeapi}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_LOG_LEVEL: "warn"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-pokemon}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anon
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
  audio-model:
    build:
      context: ./ai/audio-generation
      secrets:
        - hf_token
    container_name: ai-audio-generation
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${AI_AUDIO_GPU:-0}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    restart: always

  text-model:
    build:
      context: ./ai/text-generation
      args:
        TEXT_MODEL: ${TEXT_MODEL:-Qwen/Qwen2.5-VL-3B-Instruct}
      secrets:
        - hf_token
    container_name: ai-text-generation
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      HF_ENABLE_PARALLEL_LOADING: "true"
      HF_PARALLEL_LOADING_WORKERS: "8"
      CUDA_VISIBLE_DEVICES: ${AI_TEXT_GPU:-0}
    depends_on:
      audio-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    restart: always
    
  image-model:
    build:
      context: ./ai/image-generation
      args:
        IMAGE_MODEL: ${IMAGE_MODEL:-black-forest-labs/FLUX.2-klein-4B}
      secrets:
        - hf_token
    container_name: ai-image-generation
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      HF_ENABLE_PARALLEL_LOADING: "true"
      HF_PARALLEL_LOADING_WORKERS: "8"
      CUDA_VISIBLE_DEVICES: ${AI_IMAGE_GPU:-0}
    depends_on:
      text-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    restart: always

  background-removal-model:
    build:
      context: ./ai/background-removal
      args:
        BACKGROUND_REMOVAL_MODEL: ${BACKGROUND_REMOVAL_MODEL:-studioludens/birefnet-lite-512}
      secrets:
        - hf_token
    container_name: ai-background-removal
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      CUDA_VISIBLE_DEVICES: ${AI_BACKGROUND_GPU:-0}
      TRT_CACHE_DIR: /var/cache/onnxruntime/trt
    volumes:
      - background-removal-trt-cache:/var/cache/onnxruntime/trt
    depends_on:
      image-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    restart: always

  ai-app:
    build:
      context: ./ai/app
    container_name: ai-app
    ports:
      - "8001:8000"
    environment:
      IMAGE_SERVICE_URL: http://image-model:8000
      BACKGROUND_SERVICE_URL: http://background-removal-model:8000
      TEXT_SERVICE_URL: http://text-model:8000
      AUDIO_SERVICE_URL: http://audio-model:8000
      STORAGE_SERVICE_URL: http://storage:8000
      AI_PARALLEL_MODEL_CALLS: ${AI_PARALLEL_MODEL_CALLS:-false}
    depends_on:
      storage:
        condition: service_healthy
      image-model:
        condition: service_healthy
      background-removal-model:
        condition: service_healthy
      text-model:
        condition: service_healthy
      audio-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m
    restart: always

  storage:
    build:
      context: ./storage
    container_name: ai-storage
    ports:
      - "${STORAGE_PORT:-8002}:8000"
    environment:
      SPRITE_OUTPUT_DIR: /data/sprites/
      CRY_OUTPUT_DIR: /data/cries/
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-https://data.daemonarium.app/}
    volumes:
      - storage-assets:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: always

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: docker-tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
volumes:
  pg_data:
  redis_data:
  graphql_cache:
  storage-assets:
  background-removal-trt-cache:

secrets:
  hf_token:
    environment: HF_TOKEN
