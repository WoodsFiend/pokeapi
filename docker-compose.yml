services:
  cache:
    image: redis:8.6.4-alpine
    volumes:
      - redis_data:/data
    restart: always

  db:
    image: postgres:18.4-alpine3.24
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-ash}
      POSTGRES_DB: ${POSTGRES_DB:-pokeapi}
    volumes:
      - pg_data:/var/lib/postgresql/
    healthcheck:
      test: pg_isready -U $${POSTGRES_USER:-ash} -d $${POSTGRES_DB:-pokeapi}
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  app:
    user: ${RUN_AS:-pokeapi}
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pokemon}
      POSTGRES_USER: ${POSTGRES_USER:-ash}
      POSTGRES_DB: ${POSTGRES_DB:-pokeapi}
    volumes:
      - .:/code
      - /code/.venv/ # Ignore the venv to prevent conflicts between the host and container environments
    depends_on:
      db:
        condition: service_healthy
      cache:
        condition: service_started
    restart: always

  web:
    image: nginx:1.31.2-alpine3.23
    ports:
      - "80:80"
      - "443:443"
    restart: always
    # command: [nginx-debug, '-g', 'daemon off;']
    volumes:
      - ./Resources/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Resources/nginx/ssl:/ssl:ro
      - graphql_cache:/tmp/cache
  graphql-engine:
    image: hasura/graphql-engine:v2.49.4
    user: 1001:1001
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    restart: always
    environment:
      HASURA_GRAPHQL_DATABASE_URL: postgres://${POSTGRES_USER:-ash}:${POSTGRES_PASSWORD:-pokemon}@db:5432/${POSTGRES_DB:-pokeapi}
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_DEV_MODE: "false"
      HASURA_GRAPHQL_LOG_LEVEL: "warn"
      HASURA_GRAPHQL_ENABLED_LOG_TYPES: startup, http-log, webhook-log, websocket-log, query-log
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_GRAPHQL_ADMIN_SECRET:-pokemon}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: anon
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      # HASURA_GRAPHQL_CONSOLE_ASSETS_DIR: /srv/console-assets
  audio-model:
    build:
      context: ./ai/audio
    container_name: pokemon-ai-audio
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      HF_HOME: /cache/huggingface
      CUDA_VISIBLE_DEVICES: ${AI_AUDIO_GPU:-0}
    volumes:
      - huggingface-cache:/cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

  text-model:
    build:
      context: ./ai/text
    container_name: pokemon-ai-text
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      HF_HOME: /cache/huggingface
      CUDA_VISIBLE_DEVICES: ${AI_TEXT_GPU:-0}
    volumes:
      - huggingface-cache:/cache/huggingface
    depends_on:
      audio-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

  image-model:
    build:
      context: ./ai/image
    container_name: pokemon-ai-image
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      HF_HOME: /cache/huggingface
      CUDA_VISIBLE_DEVICES: ${AI_IMAGE_GPU:-0}
    volumes:
      - huggingface-cache:/cache/huggingface
    depends_on:
      text-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

  background-model:
    build:
      context: ./ai/background
    container_name: pokemon-ai-background
    env_file:
      - ./ai/.env
    gpus: all
    environment:
      HF_HOME: /cache/huggingface
      CUDA_VISIBLE_DEVICES: ${AI_BACKGROUND_GPU:-0}
    volumes:
      - huggingface-cache:/cache/huggingface
    depends_on:
      image-model:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30m

  ai:
    build:
      context: ./ai
    container_name: pokemon-ai
    ports:
      - "8001:8000"
    environment:
      IMAGE_SERVICE_URL: http://image-model:8000
      BACKGROUND_SERVICE_URL: http://background-model:8000
      TEXT_SERVICE_URL: http://text-model:8000
      AUDIO_SERVICE_URL: http://audio-model:8000
      GENERATED_ASSET_DIR: /app/generated-assets
      AI_PARALLEL_MODEL_CALLS: ${AI_PARALLEL_MODEL_CALLS:-false}
    volumes:
      - generated-assets:/app/generated-assets
    depends_on:
      image-model:
        condition: service_healthy
      background-model:
        condition: service_healthy
      text-model:
        condition: service_healthy
      audio-model:
        condition: service_healthy
volumes:
  pg_data:
  redis_data:
  graphql_cache:
  huggingface-cache:
  generated-assets:
